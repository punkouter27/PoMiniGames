# SAME FILE IN EVERY PO .NET WEB REPO (reference copy: PoTraffic; copy it with
# PoPunkouterSoftware/scripts/sync-ci.ps1). One grouped pull request a week per ecosystem.
#
# NuGet major versions are ignored for every package: the apps target .NET 10, and a major bump
# (ASP.NET Core 11, Microsoft.OpenApi 3, ...) needs a deliberate upgrade, not a weekly PR that
# can only fail. Action majors are allowed, so every repo's workflow moves forward together.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
