name: Deploy to Azure

# Build and unit tests gate deployment. All four test ceilings run without infrastructure.
# Provision resources with azd; this workflow deploys application code only.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_RESOURCE_GROUP: 'PoMiniGames'

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check MinVer v* tag at HEAD
        shell: bash
        run: |
          TAGS=$(git tag --points-at HEAD | grep -E '^v[0-9]' || true)
          if [ -z "$TAGS" ]; then
            echo "::warning::No v* tag at HEAD ($(git rev-parse --short HEAD)). MinVer will stamp this build with a pre-release version."
            echo "::warning::To create a release build: git tag -a vX.Y.Z <sha> && git push origin vX.Y.Z"
          else
            echo "MinVer will resolve to: $TAGS"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore PoMiniGames.slnx

      # Compile every project in the solution — src + tests — so a broken test
      # file cannot slip into master. TreatWarningsAsErrors=true (Directory.Build.props)
      # ensures zero warnings reach the artifact stage.
      #
      # PR builds stay in Debug to keep CI fast (no publish, no artifact upload);
      # only push-to-master runs the Release publish + upload that feeds the
      # deploy job. This halves PR build minutes without sacrificing the
      # "broken test file fails master" guarantee.
      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            dotnet build PoMiniGames.slnx --no-restore --configuration Debug
          else
            dotnet build PoMiniGames.slnx --no-restore --configuration Release
          fi

      # Trim-audit for the WASM client. The host's `dotnet publish`
      # exercises server-side AOT but never compiles the Blazor client with trimming
      # on, so a regression in PoShared / PoMiniGamesClient trim safety would only
      # surface at the consumer's first deploy. This step runs the same
      # PublishTrimmed + EnableTrimAnalyzer pipeline locally — if the analyzer
      # surfaces IL2xxx warnings under Debug, TreatWarningsAsErrors fails the build.
      # Release adds trimming at publish time; both must pass.
      - name: Trim audit (WASM client)
        run: |
          dotnet publish src/PoMiniGames.Client/PoMiniGamesClient.csproj \
            -c ${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }} \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -o ./client-trim-audit \
            --no-restore

      # Mobile-first budget: the trimmed WASM _framework payload gates first
      # paint on phones. Fail the build if it regresses past the budget so a new
      # reflection-heavy DTO can't silently bloat the download.
      #
      # The baseline is about 20 MB uncompressed (20,156 KB), and the bytes are the
      # runtime itself, not game code: dotnet.native.wasm ~2.9 MB, System.Private.CoreLib
      # ~1.7 MB, the three icudt*.dat globalization bundles ~3 MB combined, and the
      # pre-compressed .gz/.br twin of every one of those. PoMiniGamesClient.wasm is
      # 1.4 MB of that 20 — deleting game code will not move this number much, so a
      # regression here almost always means a new dependency or a lost trim.
      #
      # Re-baselined to ~29 MB when PoMule brought in Radzen.Blazor (1.4 MB plus
      # System.Linq.Expressions, Microsoft.CSharp and System.Private.Xml behind it) and
      # the client assembly grew to ~3 MB with the Mule rules. Budget is 35 MB: ~6 MB of
      # headroom to catch regression, not to squeeze the baseline.
      - name: WASM bundle-size budget
        shell: bash
        env:
          FRAMEWORK_BUDGET_MB: 35
        run: |
          SIZE_MB=$(du -sm ./client-trim-audit/wwwroot/_framework | cut -f1)
          echo "Trimmed _framework size: ${SIZE_MB} MB (budget ${FRAMEWORK_BUDGET_MB} MB)"
          if [ "$SIZE_MB" -gt "$FRAMEWORK_BUDGET_MB" ]; then
            echo "::error::WASM _framework ${SIZE_MB} MB exceeds budget ${FRAMEWORK_BUDGET_MB} MB."
            exit 1
          fi

      - name: Verify formatting
        run: dotnet format PoMiniGames.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Validate infrastructure
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      # No build needed: a text check for comments that swallowed rules and for
      # unbalanced braces. See the header of the script for the damage it is for.
      - name: Check stylesheets
        shell: pwsh
        run: ./scripts/css-lint.ps1

      - name: Enforce all four test ceilings
        shell: pwsh
        run: ./scripts/test-ceilings.ps1 -Configuration ${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }} -NoBuild

      - name: Publish (push-to-master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish src/PoMiniGames.API/PoMiniGames.API.csproj -c Release -o ./publish

      - name: Upload publish artifact (push-to-master only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  test:
    name: Unit tests (no infra)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      # Unit tier only — zero external dependencies. Integration/E2E stay local
      # (Azurite + Playwright). See the CI/CD policy header.
      - name: Run unit tests
        run: dotnet test tests/PoMiniGames.Unit/PoMiniGames.Unit.csproj --configuration Debug
      # The JS half of the PoBrawl rollback contract (tests/pobrawl-rollback-golden.json);
      # the C# half runs in the unit tier above. Node ships on ubuntu-latest.
      - name: Run PoBrawl rollback sim parity (JS)
        run: node --test tests/pobrawl-rollback.test.mjs

  deploy:
    name: Deploy to Azure App Service
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      id-token: write
      contents: read
    steps:
      # No checkout: this job only ships the artifact the build job published.
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Same step in every Po web repo. F1 gives the app about 60 CPU-minutes a day; once spent, Azure stops the
      # site (usageState Exceeded) until 00:00 UTC and refuses the package with a bare 403. Say what it is.
      - name: Check the F1 daily CPU quota
        run: |
          usage=$(az webapp show -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" --query usageState -o tsv)
          if [ "$usage" = "Exceeded" ]; then
            echo "::error::${{ vars.AZURE_WEBAPP_NAME }} has used up its F1 daily CPU quota, so Azure refuses the package until 00:00 UTC. Rerun after that."
            exit 1
          fi

      # This app's package is ~100 MB, and on the Windows F1 instance Kudu leaves each zip deploy's upload and
      # unpacked copy in C:\local\Temp\zipdeploy. Two of them fill the small local disk and the next deploy fails
      # with "There is not enough space on the disk" (2026-10-28). Clear them first; a missing folder is fine.
      - name: Clear stale zip-deploy temp files
        run: |
          token=$(az account get-access-token --query accessToken -o tsv)
          curl -fsS --max-time 120 -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            "https://${{ vars.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/command" \
            -d '{"command":"cmd /c if exist C:\\local\\Temp\\zipdeploy rd /s /q C:\\local\\Temp\\zipdeploy","dir":"C:\\local\\Temp"}' \
            || echo "::warning::Could not clear the zip-deploy temp folder; the deploy may run out of local disk."

      # Same pair in every Po web repo: keep the live build, and put it back if anything fails once the
      # new package is live (see "Roll back to the previous build" at the end of this job).
      - name: Back up the live site
        id: backup
        run: |
          token=$(az account get-access-token --query accessToken -o tsv)
          if curl -fsS --max-time 300 -H "Authorization: Bearer $token" -o previous.zip \
               "https://${{ vars.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/zip/site/wwwroot/" && [ -s previous.zip ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Backed up $(du -h previous.zip | cut -f1) of the live site."
          else
            echo "::warning title=No backup::Could not download the live site, so this deploy cannot be rolled back."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to App Service
        id: deploy
        shell: bash
        run: |
          # Self-healing target resolution: discover the API web app from its
          # resource group instead of hard-coding a name. A future resource
          # rename can no longer silently 404 the deploy (the original failure mode).
          APP_NAME="${{ vars.AZURE_WEBAPP_NAME }}"
          if [ -z "$APP_NAME" ]; then echo "::error::No web app found in the configured resource group"; exit 1; fi
          echo "Resolved App Service: $APP_NAME"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          # Zip the publish *contents* (not the parent folder) so the host finds
          # PoMiniGames.API.dll at the deployment root, not nested under publish/.
          # Combined with WEBSITE_RUN_FROM_PACKAGE=1 (set in resources.bicep), the
          # zip is mounted atomically — no file-copy step on the host.
          ( cd publish && zip -qr ../app-deploy.zip . )
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --src-path app-deploy.zip \
            --type zip \
            --track-status true

      # One loop both absorbs the F1 cold start (the retries) and is the smoke test (the exit).
      # Same gate in every Po web repo: the new build is the one answering (X-Commit on /health/live is this
      # commit, not the old instance still serving), then its dependencies answer (/health).
      - name: Health gate (this commit on /health/live, then /health)
        shell: bash
        run: |
          base="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for attempt in $(seq 1 60); do
            commit=$(curl -s -D - -o /dev/null --max-time 30 "$base/health/live" | tr -d '\r' | awk -F': ' 'tolower($1)=="x-commit" {print $2}')
            [ "$commit" = "$GITHUB_SHA" ] && { echo "/health/live serves $GITHUB_SHA (attempt $attempt)"; break; }
            [ "$attempt" = "60" ] && { echo "::error::/health/live still serves ${commit:-no X-Commit header}, not $GITHUB_SHA"; exit 1; }
            sleep 15
          done
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/health" || echo 000)
            [ "$code" = "200" ] && { echo "/health -> 200 (attempt $attempt)"; exit 0; }
            sleep 15
          done
          echo "::error::/health never returned 200 (last: $code)"; exit 1

      - name: Smoke tests (health, diag)
        shell: bash
        run: |
          for path in "/api/health/ping" "/api/health" "/api/diag"; do
            echo "Smoke testing ${path}..."
            curl -fsS --retry 10 --retry-all-errors --retry-delay 5 \
              "https://${APP_NAME}.azurewebsites.net${path}" || exit 1
          done

      - name: Roll back to the previous build
        if: failure() && steps.deploy.outcome == 'success' && steps.backup.outputs.ok == 'true'
        run: |
          az webapp deploy -g "${{ github.event.repository.name }}" -n "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path previous.zip --type zip --clean true
          echo "::error title=Rolled back::${{ github.sha }} failed after it went live; the previous build is live again."
