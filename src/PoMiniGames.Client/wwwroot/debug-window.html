<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PoMiniGames · Live diagnostics</title>
    <link rel="stylesheet" href="css/po-tokens.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            padding: 16px;
            background: var(--color-bg);
            color: var(--color-text-primary);
            font-family: var(--font-sans, system-ui, sans-serif);
            font-size: 0.9rem;
        }
        h1 { margin: 0 0 4px; font-size: 1.05rem; }
        .dw-sub { margin: 0 0 12px; color: var(--color-text-secondary); font-size: 0.8rem; }
        .dw-state { display: inline-flex; align-items: center; gap: 6px; }
        .dw-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-text-secondary); }
        .dw-live .dw-dot { background: var(--accent-success); }
        dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
        dt { color: var(--color-text-secondary); }
        dd { margin: 0; font-family: var(--font-mono, ui-monospace, monospace); font-variant-numeric: tabular-nums; }
        .ok { color: var(--accent-success); }
        .warn { color: var(--color-warning); }
        .bad { color: var(--color-error); }
        canvas { display: block; width: 100%; height: 64px; margin: 12px 0; border: 1px solid var(--color-border); border-radius: 8px; }
        section + section { margin-top: 16px; }
        h2 { margin: 0 0 6px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-secondary); }
    </style>
</head>
<body>
    <h1>Live diagnostics</h1>
    <p class="dw-sub"><span class="dw-state" id="dw-state"><span class="dw-dot" aria-hidden="true"></span><span id="dw-state-text">Waiting for the app tab…</span></span></p>
    <canvas id="dw-graph" width="600" height="64" aria-label="Frame rate over the last minute" role="img"></canvas>
    <section>
        <h2>Frame</h2>
        <dl id="dw-frame"></dl>
    </section>
    <section>
        <h2>Page</h2>
        <dl id="dw-page"></dl>
    </section>
    <section id="dw-game-section" hidden>
        <h2>Game</h2>
        <dl id="dw-game"></dl>
    </section>
    <script src="js/platform/debug-window.js"></script>
</body>
</html>
