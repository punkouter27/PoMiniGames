<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PoMiniGames</title>
    <base href="/" />

    <!-- Bug fix QA #10: start the WASM download as early as possible so the
         browser can warm up the connection and overlap the TCP/TLS handshake
         with the HTML parse. The actual script tag below drives execution;
         the modulepreload just primes the network. ~1.2 s cold-start win.
         Note: only blazor.webassembly.js is the real, non-hashed boot script.
         The dotnet.* runtime + native modules are emitted with content hashes
         and discovered at runtime by the Blazor loader — preloading them by
         their unhashed names 404s and pollutes DevTools with red noise. -->
    <!-- The import map MUST stay above the modulepreload below, and above every
         other module script on the page. Per the HTML spec an import map is
         rejected once a module load has already been *triggered*, and a
         `modulepreload` counts as triggering one — so while this block sat lower
         in the head (next to glass.css, where it lived until 2026-09-11) Chrome
         logged "An import map is added after module script load was triggered"
         on EVERY page load and threw the whole map away.

         That was not cosmetic: with no map, `import "three"` is a bare specifier
         with nothing to resolve against, so engineLoader.js failed with
         "Failed to resolve module specifier" and PoMarbleRace and PoVoxelStrike
         rendered no canvas at all — both games were completely dead. Verified by
         re-running both routes after the hoist: three.module.js, cannon-es and
         ~20 addons fetch, the canvas renders, console is clean.

         Anything that adds a module script earlier than this line reintroduces
         the bug silently — the games just stop, with one console line. -->
    <!-- Every 3D engine renders with WebGPURenderer and node materials (TSL), which need the
         three/webgpu + three/tsl builds, so they import the pinned r186 copy as
         "three-eco/webgpu" / "three-eco/tsl" / "three-eco/addons/". The scope makes the bare
         "three/webgpu" and "three/tsl" specifiers INSIDE that copy resolve to the same r186 files.
         Bump the version and the integrity hashes together.

         "rapier" (@dimforge/rapier3d-compat: the WASM is inside the module) is PoCabinet's debris
         physics on the medium and high tiers (js/pocabinet/debris-rapier.js) and PoEcosystem's
         prop physics (js/poecosystem/sim/physics/rapierWorld.js: its worker imports the same
         URL directly, RAPIER_CDN_URL in sim/core/config.js, and this entry serves the
         main-thread fallback). Nothing imports it until one of those games starts. Bump the
         version here and in config.js together.

         "transformers" (@huggingface/transformers, ONNX Runtime Web inside) is PoCapitol's opt-in
         in-browser debrief writer (js/pocapitol/debrief.js, provider "browser"); nothing imports
         it unless the player picks that writer. Its model comes from huggingface.co / *.hf.co
         (connect-src in AppPipelineExtensions.cs).

         "yuka" (crowd steering, PoCapitol) and "cannon-es" (physics, also imported directly by
         PoEcosystem's Web Worker) are served from this origin instead of the CDN so browser
         engines, Web Workers, and Node tests run against the same local copy. -->
    <script type="importmap">
    {
      "imports": {
        "cannon-es": "/lib/cannon-es/cannon-es.js",
        "yuka": "/lib/yuka/yuka.module.js",
        "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs",
        "transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js",
        "three-eco/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
        "three-eco/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
        "three-eco/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
        "tone": "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm"
      },
      "scopes": {
        "https://cdn.jsdelivr.net/npm/three@0.186.1/": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js"
        }
      },
      "integrity": {
        "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs": "sha384-oPyJtSnZbl4qLdnQQ+3vWOQFLDFyMOcSgLr1xxtO2B2JUahMwj6wRA6I7pbueGxx",
        "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js": "sha384-ypqDKlGaciPzMZFxk0iPx9blYGxbZIWTqZX7f6BuiicO9rTfnXfprLBev5KE5OfK",
        "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js": "sha384-4BcMoAQ5pbGKlA/ACC52ZLD19HUU8F/mGnEtg8LEb6G0S5xckMOrpPtPHQMzWi0D",
        "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js": "sha384-mdKeCwPEcbDvzaxwhm+MVuLoMou+E7jQqrs4tmu/n8HBYPGI1kZt0MkJxlMR4zFM",
        "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js": "sha384-i76xepHrmVxDoGJBGuT2FUEUGw0jdaDjus4NJ40g1FtIyusteqsUxnSz8avnH130",
        "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/tsl/display/BloomNode.js": "sha384-i681B4DcPx08phYxUWUXAWtpILC5sB+eIKXSxbTTQK5ZP+MB1D2j4HOz41lkNLNI",
        "https://cdn.jsdelivr.net/npm/tone@15.0.4/+esm": "sha384-u7nYEXR9bDKk5jSis6akij+/PDJMzDhh7Rb2NizHzbelZeamqL3qEIqm+1LoM0AG"
      }
    }
    </script>

    <link rel="modulepreload" href="_framework/blazor.webassembly.js" />

    <!-- Motion and colour-safe resolution, render-blocking external script (no inline script for CSP). -->
    <script src="js/platform/bootPrefs.js"></script>

    <!-- Radzen's theme loads once, FIRST, before any app stylesheet (Po standard, Profile A): the app's CSS
         below then wins every tie, so pages keep their own look. Light and dark follow the device; the ids are the
         ones js/platform/radzenTheme.js checks, so a Radzen page never adds them a second time. The theme only
         adds .rz-* classes plus three element rules (body margin, input colour and size). -->
    <link id="pomule-radzen-css" rel="stylesheet" href="_content/Radzen.Blazor/css/material-dark-base.css?v=12.2.0" media="(prefers-color-scheme: dark)" />
    <link id="pomule-radzen-css-light" rel="stylesheet" href="_content/Radzen.Blazor/css/material-base.css?v=12.2.0" media="not all and (prefers-color-scheme: dark)" />

    <!-- Typography and the estate look: po-tokens.css comes FIRST among the app's
         stylesheets. It self-hosts Inter and Space Grotesk (fonts/, same-origin, so no CSP
         change) and carries the shared shell: .po-header, .po-version, /diag cards.
         app-tokens.css then aliases the app's own variables to the --po-* tokens.
         fonts.css only adds Bungee, the PoBrawl HUD's display face. -->
    <link rel="stylesheet" href="css/po-tokens.css" />
    <link rel="stylesheet" href="css/app-tokens.css" />
    <link rel="stylesheet" href="css/po-motion.css" />
    <link rel="stylesheet" href="css/fonts.css" />

    <!-- Remove Bootstrap – all styles are custom (payload savings ~187KB) -->
    <!-- app.css carries the design tokens + app shell — render-blocking on purpose
         so first paint is fully styled. -->
    <link rel="stylesheet" href="css/app.css" />
    <!-- app-shell.css: the SHARED, non-scoped top-bar chrome. Render-blocking so
         the header is styled on first paint. Non-scoped (unlike MainLayout's
         component CSS) so every layout reusing the gl-top-bar markup inherits
         identical chrome instead of rendering bare. -->
    <link rel="stylesheet" href="css/app-shell.css" />
    <!-- §3 Per-game stylesheets are non-render-blocking: each only matters once its
         game route is entered (by which point it's cached), so loading them async
         keeps first paint gated on app.css alone (~640 lines) instead of the full
         ~5,400-line global bundle. Same preload-swap pattern used for the webfonts. -->
    <!-- game-shell.css is the SHARED game chrome (the end-of-game modal every
         game ends on). Loaded ahead of games.css so per-game rules can't win a
         specificity tie against it by accident. -->
    <link rel="stylesheet" href="css/game-shell.css" />
    <!-- §GFX fx.css: platform effects layer (glass, animatable gradients,
         compositor-only motion, adaptive-quality rules). -->
    <link rel="stylesheet" href="css/fx.css" />
    <!-- fight.css deleted 2026-08-07: 22 classes, none referenced by any markup.
         It was the stylesheet for the old PoFight game and did not follow that
         game through its rename to PoBrawl, which styles itself from
         PoBrawlPage.razor.css (.pb-*). It stayed preloaded on every page for
         7.8 KB that could never match an element. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171a23" />
    <meta name="description" content="PoMiniGames — instant-play mini-games with AI opponents, real-time 2P multiplayer, and global leaderboards. Offline-resilient." />
    <meta property="og:title" content="PoMiniGames" />
    <meta property="og:description" content="Instant-play mini-games · AI opponents · real-time 2P multiplayer · leaderboards." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link href="PoMiniGames.Client.styles.css" rel="stylesheet" />
    <!-- §GFX-6 glass.css is the APPLIED glassmorphism layer (fx.css holds the
         primitives). It must stay LAST: several of its targets are styled by
         Blazor scoped CSS, whose `[b-xxxxxxxxxx]` selectors it matches on
         specificity via doubled class names and then beats on source order.
         Move this line above PoMiniGames.Client.styles.css and every per-game
         HUD silently loses the treatment. Not preloaded-async for the same
         reason — the swap would reinsert it at its original position anyway,
         but a render-blocking load also avoids a flash of unglassed chrome. -->
    <link rel="stylesheet" href="css/glass.css" />

    <!-- Shared canvas resolution policy (audit #8). Not deferred and listed
         first among the game scripts: the racing renderer and the engine modules
         read window.PoCanvasDpr during their own setup. -->
    <script src="js/platform/canvasDpr.js"></script>
    <!-- Records which canvases got a WebGPU / WebGL context, for the top-nav FPS pill.
         Must run before any game script creates a context. -->
    <script src="js/platform/gpuBackend.js"></script>
    <!-- Reports uncaught errors, console.error and lost WebGL contexts to the server
         log (POST /client-errors). Must stay ABOVE consoleFilter.js: the filter then
         wraps this file's console.error, so the noise it drops is never reported. -->
    <script src="js/platform/errorReporter.js"></script>
    <!-- Kiosk reel polish: filter the harmless "AudioContext closed" warnings
         that print on every demo transition. Loaded eagerly so it wraps
         console.warn/error before the game audio modules install their paths.
         The original methods are stashed on window.__poConsole for debugging. -->
    <script src="js/platform/consoleFilter.js"></script>
    <!-- View Transitions + App enhancements (Suggestion #5) -->
    <script src="js/platform/app.js" defer></script>
    <!-- AppErrorBoundary fallback clipboard helper (non-secure-context safe) -->
    <script src="js/platform/appErrorBoundary.js" defer></script>
    <!-- Po standard: Tab with nothing focused opens /po-dev.html (live diagnostics) in a new
         tab of the same browser window. A plain external script. -->
    <script src="js/po-devwindow.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress" viewBox="0 0 100 100">
            <circle r="40" cx="50" cy="50" />
            <circle r="40" cx="50" cy="50" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
          <a href="/" class="reload">Reload app</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- Per-game interop is NOT loaded here any more (2026-08-07).
         gl-fps.js was a global <script> tag, so every page in the app fetched
         and parsed code that one opt-out diagnostic ever calls. It is now
         imported at its point of use, FpsCounter, which still assigns a window
         global on evaluation. -->
    <!-- Radzen's script, once, before Blazor boots (Radzen's own setup): dropdowns, sliders and select bars in
         game pages, start cards and lobbies call it on first render. js/platform/radzenTheme.js finds it loaded and
         adds nothing; the same URL keeps one cache entry (service-worker.published.js allowlists it). -->
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js?v=12.2.0"></script>
    <script src="js/platform/radzenTopLayer.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- ── Game engines: route-gated, NOT loaded here ──────────────────────────
         marblerace, pobrawl and poracer used to be eager <script>
         tags at this position. Together with their three.js / cannon-es imports
         that is ~24,600 lines of JavaScript parsed on first paint to render a
         menu, and almost no session opens more than one game.

         They are now pulled in by js/platform/engineLoader.js when a game page actually
         mounts. The interop contract is unchanged — each engine still registers
         its window.PoBrawl / window.PoMarbleRace / … global, and pages still call
         through it; the page just awaits `loadEngine('<name>')` first.

         PoRacer's input, renderer, interpolation and compositor are imported
         explicitly by js/poracer/index.js. -->
    <script type="module" src="js/platform/engineLoader.js"></script>

    <!-- §GFX/SOUND platform runtime (2026-07-29).
         audioBus.js owns the app's ONE AudioContext and the master/music/sfx/ui
         mix graph; five modules used to construct a context each. It must be
         imported before any module that plays a sound, hence its position here.
         visualRuntime.js runs the single rAF loop that publishes both the
         reactive bands (--audio-*, from cues and the pointer) and the adaptive-quality tier (data-gfx). -->
    <script type="module" src="js/platform/audioBus.js"></script>
    <script type="module" src="js/platform/richAudio.js"></script>
    <script type="module" src="js/platform/speechBus.js"></script>
    <script type="module" src="js/platform/localTts.js"></script>
    <script type="module" src="js/platform/localEmbeddings.js"></script>
    <!-- uiAudio.js binds the keyboard-only data-sonify listener (menu focus/select cues) at load;
         without this tag it only arrived with the first game that imported it, so the hub was silent. -->
    <script type="module" src="js/platform/uiAudio.js"></script>
    <script type="module" src="js/platform/visualRuntime.js"></script>
    <!-- §GFX-10 synthesis moved to an AudioWorklet; dsp.js is the main-thread
         front end and acoustics.js owns the per-game reverb spaces. Both are
         inert until first use — the worklet module is fetched lazily on the
         first cue, not here, because addModule() needs a live AudioContext and
         that only exists after a user gesture. -->
    <script type="module" src="js/platform/dsp.js"></script>
    <script type="module" src="js/platform/acoustics.js"></script>
    <!-- §GFX-11 the sound vocabulary. Imports dsp/impact/gpuFx and is what call
         sites should use: one fire() gets audio, screen feel and particles. -->
    <script type="module" src="js/platform/gameCues.js"></script>
    <!-- §GFX-7/8 shared feel layer. Both are inert on load: impactBus.js only
         appends its flash div, gpuFx.js does not touch WebGL until the first
         burst. Loading them here rather than lazily means a game's first hit
         does not pay a module fetch at the exact frame it needs to be smooth. -->
    <script type="module" src="js/platform/impactBus.js"></script>
    <script type="module" src="js/platform/gpuFx.js"></script>
    <!-- §GFX-6 pointer-tracked tilt for [data-fx-tilt] surfaces. One delegated
         listener; idle until something is hovered. -->
    <script type="module" src="js/platform/fxTilt.js"></script>
    <!-- Spring press / hover parallax for [data-spring] and [data-magnetic] controls
         (deck #17), and the five-beat end-of-game ceremony GameOverModal starts (deck #19).
         Both are delegated listeners or idle functions until used. -->
    <script type="module" src="js/platform/springUi.js"></script>
    <script type="module" src="js/platform/resultCeremony.js"></script>
    <!-- Controllers: gamepadBus.js (D-pad focus navigation, pad rumble for impactBus haptics) is
         fetched on the first gamepadconnected only, so a player without a pad pays nothing. -->
    <script type="module">addEventListener('gamepadconnected', () => import('./js/platform/gamepadBus.js').then((m) => m.startNav()), { once: true });</script>
    <!-- §GFX-12…21 the quality/palette/sound bootstrap. Decides the device's
         quality tier BEFORE any game asks for it, owns the dynamic accent
         palette, and
         background-probes WebGPU for the particle backend. Everything heavier
         (glass captures, weather, props) stays lazy in the games that use it. -->
    <script src="js/platform/fxBootstrap.js" defer></script>
    <!-- Native <dialog> interop (Option #9). showModal / close are HTMLDialogElement
         methods Blazor's ElementReference doesn't bind directly, so a tiny shim
         exposes them on `window.PoDialogInterop`. Must be present BEFORE the
         GameOverModal renders; defer keeps it off the critical render path. -->
    <script src="js/platform/dialogInterop.js" defer></script>
    <!-- PWA: service worker registration + connectivity signals. Registration is
         kicked off from MainLayout (not here) so the update toast has a live Blazor
         renderer to display into. -->
    <!-- PWA: service worker registration + connectivity signals -->
    <script src="js/platform/pwa.js" defer></script>
</body>

</html>
