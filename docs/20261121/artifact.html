<!doctype html>
<html lang="en" data-tier="2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PoMiniGames Docs Suite</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<script>
(function () {
  var r = document.documentElement;
  try {
    var t = localStorage.getItem('net_docs_tier');
    if (t === '1' || t === '2' || t === '3') r.setAttribute('data-tier', t);
    var th = localStorage.getItem('net_docs_theme');
    if (th === 'light' || th === 'dark') r.setAttribute('data-theme', th);
  } catch (e) {}
})();
</script>
<style>
/* Layout: an app frame. One control bar on top, the selected report fills the rest of the screen. Tokens match the five reports. */
:root {
  --bg: #f6f7fb; --surface: #ffffff; --surface-2: #eef0f6; --text: #141826; --muted: #596075;
  --accent: #4f46e5; --accent-soft: #e8e7fd; --border: #dcdfe8;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1117; --surface: #171a23; --surface-2: #1e2230; --text: #e8eaf2; --muted: #a1a8bd;
    --accent: #8b85ff; --accent-soft: #24224a; --border: #2c3142; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1117; --surface: #171a23; --surface-2: #1e2230; --text: #e8eaf2; --muted: #a1a8bd;
  --accent: #8b85ff; --accent-soft: #24224a; --border: #2c3142; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--font-body); display: flex; flex-direction: column; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.top {
  flex: 0 0 auto; background: var(--surface); border-bottom: 1px solid var(--border);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 0;
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.brand { font: 700 1.05rem/1.2 var(--font-display); letter-spacing: -0.01em; margin-right: auto; }
.brand small { font: 500 0.72rem var(--font-mono); color: var(--muted); margin-left: 6px; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; background: var(--surface-2); }
.seg button, .theme-btn { font: 500 0.8rem var(--font-body); color: var(--muted); background: transparent; border: 0; border-radius: 999px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.theme-btn { border: 1px solid var(--border); background: var(--surface-2); }
.label { font: 500 0.7rem var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: thin; }
.tabs a {
  flex: 0 0 auto; text-decoration: none; color: var(--muted); font: 500 0.9rem var(--font-body);
  padding: 8px 12px 10px; border-bottom: 2px solid transparent;
}
.tabs a:hover { color: var(--text); }
.tabs a[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.frame { flex: 1 1 auto; min-height: 0; position: relative; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
.foot {
  flex: 0 0 auto; border-top: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 0.75rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px));
}
.foot code { font-family: var(--font-mono); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="net-docs-shell" class="top">
  <div class="row">
    <div class="brand">PoMiniGames docs<small>593c148a · 2026-11-21</small></div>
    <div class="controls">
      <span class="label" id="tier-label">Detail</span>
      <div class="seg" role="group" aria-labelledby="tier-label">
        <button type="button" id="tier-1" data-tier-btn="1" aria-pressed="false" title="Plain English only">1 Simple</button>
        <button type="button" id="tier-2" data-tier-btn="2" aria-pressed="true" title="Adds diagrams and component layouts">2 Architecture</button>
        <button type="button" id="tier-3" data-tier-btn="3" aria-pressed="false" title="Adds file:line citations, schemas and configs">3 Code</button>
      </div>
      <button type="button" class="theme-btn" id="theme-btn">Theme: system</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Reports">
    <a role="tab" href="#overview" data-src="index.html" aria-controls="report">Overview</a>
    <a role="tab" href="#workflows" data-src="USER_WORKFLOW.html" aria-controls="report">User Workflows</a>
    <a role="tab" href="#architecture" data-src="VISUAL_ARCHITECTURE_DASHBOARD.html" aria-controls="report">Architecture</a>
    <a role="tab" href="#services" data-src="AI_SERVICES_REPORT.html" aria-controls="report">AI &amp; Services</a>
    <a role="tab" href="#security" data-src="AUTH_SECURITY_REPORT.html" aria-controls="report">Security</a>
  </nav>
</div>
<div class="frame"><iframe id="report" title="Report" src="index.html"></iframe></div>
<footer class="foot">Generated 2026-11-21 · commit <code>593c148a</code> (master) · citations are path:line at that commit</footer>
<script>
(function () {
  var root = document.documentElement, frame = document.getElementById('report');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tabs a'));
  function save(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function tier() { return root.getAttribute('data-tier') || '2'; }
  function theme() { return root.getAttribute('data-theme') || 'system'; }
  function push() {
    try { frame.contentWindow.postMessage({ type: 'net-docs', tier: tier(), theme: theme() }, '*'); } catch (e) {}
  }
  function setTier(t, quiet) {
    if (!/^[123]$/.test(String(t))) t = '2';
    root.setAttribute('data-tier', t); save('net_docs_tier', t);
    document.querySelectorAll('[data-tier-btn]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-tier-btn') === String(t))); });
    if (!quiet) push();
  }
  function setTheme(th, quiet) {
    if (th === 'light' || th === 'dark') root.setAttribute('data-theme', th); else { root.removeAttribute('data-theme'); th = 'system'; }
    save('net_docs_theme', th === 'system' ? null : th);
    document.getElementById('theme-btn').textContent = 'Theme: ' + th;
    if (!quiet) push();
  }
  function show(hash) {
    var tab = tabs.filter(function (a) { return a.getAttribute('href') === hash; })[0] || tabs[0];
    tabs.forEach(function (a) { a.setAttribute('aria-selected', String(a === tab)); a.tabIndex = a === tab ? 0 : -1; });
    var src = tab.getAttribute('data-src');
    if (frame.getAttribute('src') !== src) frame.setAttribute('src', src);
    frame.title = tab.textContent + ' report';
  }
  document.querySelectorAll('[data-tier-btn]').forEach(function (b) { b.addEventListener('click', function () { setTier(b.getAttribute('data-tier-btn')); }); });
  document.getElementById('theme-btn').addEventListener('click', function () {
    var c = theme(); setTheme(c === 'system' ? 'light' : c === 'light' ? 'dark' : 'system');
  });
  tabs.forEach(function (a, i) {
    a.addEventListener('keydown', function (e) {
      var n = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : null;
      if (n === null) return;
      e.preventDefault(); var t = tabs[(n + tabs.length) % tabs.length]; t.focus(); t.click();
    });
  });
  // Links inside a report that point at another report switch the tab instead of nesting the shell.
  frame.addEventListener('load', function () {
    push();
    try {
      frame.contentDocument.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
        var href = a.getAttribute('href');
        if (href === 'artifact.html') { e.preventDefault(); return; }
        var tab = tabs.filter(function (t) { return t.getAttribute('data-src') === href; })[0];
        if (tab) { e.preventDefault(); location.hash = tab.getAttribute('href'); }
      });
    } catch (e) {}
  });
  window.addEventListener('message', function (e) {
    var d = e.data; if (!d || d.type !== 'net-docs') return;
    if (d.tier) setTier(d.tier, true);
    if (d.theme) setTheme(d.theme, true);
  });
  window.addEventListener('hashchange', function () { show(location.hash); });
  setTier(tier(), true); setTheme(theme(), true);
  show(location.hash || '#overview');
})();
</script>
</body>
</html>
