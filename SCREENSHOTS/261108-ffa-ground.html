<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoBrawl FFA - knocked-out fighters stay on the mat</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 "Segoe UI", sans-serif; background: #101725; color: #edf2f8; }
    body { margin: 0; padding: 24px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    section { padding: 16px; border: 1px solid #35445a; border-radius: 12px; background: #182337; }
    img { width: 100%; border-radius: 8px; }
    .note { padding: 12px; border-left: 4px solid #ffd166; background: #222b38; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>PoBrawl FFA - keep the knockouts on the ground</h1>
  <main>
    <section aria-label="Before">
      <h2>Before</h2>
      <img src="261108-ffa-ground-before.png" alt="FFA result before persistent knockout bodies">
      <p class="note">Knocked-out fighters disappeared shortly after falling.</p>
    </section>
    <section aria-label="After">
      <h2>After</h2>
      <img src="261108-ffa-ground-after.png" alt="FFA result with fifteen knocked-out fighters lying on the mat">
      <p class="note">All fifteen knockouts remain visible, settled on the mat. Only the next round stands them back up.</p>
    </section>
  </main>
</body>
</html>
