<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FFA cinematic danger camera</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 "Segoe UI", sans-serif; background: #101725; color: #edf2f8; }
    body { margin: 0; padding: 24px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    section { padding: 16px; border: 1px solid #35445a; border-radius: 12px; background: #182337; }
    img { width: 100%; border-radius: 8px; }
    p { padding: 12px; border-left: 4px solid #ffd166; background: #222b38; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>FFA cinematic danger camera</h1>
  <main>
    <section>
      <h2>Before: fixed overhead overview</h2>
      <img src="261108-ffa-camera-before.png" alt="FFA with its old static overview camera">
      <p>The camera stayed wide regardless of who was about to be knocked out.</p>
    </section>
    <section>
      <h2>After: follow the fighter in danger</h2>
      <img src="261108-ffa-camera-after.png" alt="Cinematic FFA close-up of the lowest-health fighter">
      <p>Three alternating angles follow the lowest-health survivor, linger on a knockout, then cover the next endangered fighter.</p>
    </section>
  </main>
</body>
</html>
